# Builds a signed release APK and AAB when a tag like v1.0.0 is pushed, and attaches the APK to a
# GitHub Release. The AAB, which is what Play takes, is kept as a workflow artifact.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ATTIC_UPLOAD_STORE_FILE      the upload keystore, base64-encoded: base64 -i upload.jks | pbcopy
#   ATTIC_UPLOAD_STORE_PASSWORD  the keystore password
#   ATTIC_UPLOAD_KEY_ALIAS       the key alias inside it
#   ATTIC_UPLOAD_KEY_PASSWORD    the key password
#
# The build step decodes the keystore to a file and passes all four to Gradle, both as environment
# variables (ATTIC_UPLOAD_STORE_FILE then holds the file's path) and as Gradle properties through
# ORG_GRADLE_PROJECT_*, so the signing config can read either.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" > /dev/null

      - name: Check the tag against versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version_name" != "$TAG" ]; then
            echo "::warning::Tag $TAG doesn't match versionName \"$version_name\" in app/build.gradle.kts. IzzyOnDroid and F-Droid match tags to versionName."
          fi

      - name: Decode the upload keystore
        env:
          STORE_BASE64: ${{ secrets.ATTIC_UPLOAD_STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.ATTIC_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATTIC_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ATTIC_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in STORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::A signing secret is missing. Set ATTIC_UPLOAD_STORE_FILE, ATTIC_UPLOAD_STORE_PASSWORD, ATTIC_UPLOAD_KEY_ALIAS and ATTIC_UPLOAD_KEY_PASSWORD."
              exit 1
            fi
          done
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the release APK and AAB
        env:
          ATTIC_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ATTIC_UPLOAD_STORE_PASSWORD: ${{ secrets.ATTIC_UPLOAD_STORE_PASSWORD }}
          ATTIC_UPLOAD_KEY_ALIAS: ${{ secrets.ATTIC_UPLOAD_KEY_ALIAS }}
          ATTIC_UPLOAD_KEY_PASSWORD: ${{ secrets.ATTIC_UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ATTIC_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_ATTIC_UPLOAD_STORE_PASSWORD: ${{ secrets.ATTIC_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ATTIC_UPLOAD_KEY_ALIAS: ${{ secrets.ATTIC_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ATTIC_UPLOAD_KEY_PASSWORD: ${{ secrets.ATTIC_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease bundleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Until the signing config reads the secrets, release builds fall back to the debug key.
      # Refuse to publish an APK signed that way.
      - name: Check the APK isn't debug-signed
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$certs" | grep 'Signer #1 certificate DN'
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi

      - name: Name the outputs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/attic-$TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/attic-$TAG.aab"
          (cd dist && sha256sum "attic-$TAG.apk" > "attic-$TAG.apk.sha256")
          # Release notes: this version's section of CHANGELOG.md, without its heading.
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { inside = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { next }
            inside { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then echo "See CHANGELOG.md." > dist/notes.md; fi

      - name: Keep the AAB for Play
        uses: actions/upload-artifact@v7
        with:
          name: attic-${{ github.ref_name }}-aab
          path: dist/attic-${{ github.ref_name }}.aab
          if-no-files-found: error

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Attic ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/attic-${{ github.ref_name }}.apk
            dist/attic-${{ github.ref_name }}.apk.sha256
