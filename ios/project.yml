name: Attic
options:
  bundleIdPrefix: app.attic
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AtticModules:
    path: Packages/AtticModules
targets:
  Attic:
    type: application
    platform: iOS
    sources:
      - path: Attic
    dependencies:
      - package: AtticModules
        product: AtticUI
    info:
      path: Attic/Info.plist
      properties:
        CFBundleDisplayName: Attic
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.attic.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  AtticTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AtticTests
    dependencies:
      - package: AtticModules
        product: AtticCore
      - package: AtticModules
        product: AtticLibrary
      - package: AtticModules
        product: AtticPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.attic.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Attic:
    build:
      targets:
        Attic: all
        AtticTests: [test]
    test:
      targets:
        - AtticTests
