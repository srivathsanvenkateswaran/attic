[versions]
agp = "9.4.1"
kotlin = "2.4.10"
ksp = "2.3.13"
composeBom = "2026.09.00"
media3 = "1.11.1"
room = "2.8.5"
coil = "3.6.3"
navigation = "2.10.2"
lifecycle = "2.11.0"
activity = "1.13.0"
coreKtx = "1.19.1"
splash = "1.2.0"
palette = "1.1.0"
coroutines = "1.11.0"
reorderable = "3.1.0"
onnxruntime = "1.31.1"
work = "2.12.0"
junit = "4.13.2"
robolectric = "4.18.1"
roborazzi = "1.79.0"
androidxTestCore = "1.7.0"
orgJson = "20250517"
sqliteJdbc = "3.41.2.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
core-splash = { module = "androidx.core:core-splashscreen", version.ref = "splash" }
palette = { module = "androidx.palette:palette-ktx", version.ref = "palette" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
junit = { module = "junit:junit", version.ref = "junit" }
# Store screenshots only (see app/build.gradle.kts, -PstoreShots).
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
# Android's org.json is a stub in local unit tests; the backup codec tests run on the reference one.
org-json = { module = "org.json:json", version.ref = "orgJson" }
# The migration test runs Room's exported SQL on plain SQLite.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
# The desktop build of the same runtime, so the model test runs the real model on the JVM.
onnxruntime-jvm = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
